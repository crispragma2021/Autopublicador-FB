name: 🐛 Debug Deploy to Cloudflare

on:
  push:
    branches: [main]

jobs:
  debug-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        
      - name: 📁 Debug structure
        run: |
          echo "=== ESTRUCTURA BACKEND ==="
          ls -la backend/
          echo "=== WRANGLER.TOML ==="
          cat backend/wrangler.toml
          echo "=== PACKAGE.JSON ==="
          cat backend/package.json
          
      - name: 🛠️ Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: './backend'
